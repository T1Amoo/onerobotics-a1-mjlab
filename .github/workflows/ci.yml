name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  MUJOCO_GL: disable
  UV_FROZEN: "1"

jobs:
  quality-test-package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.13"
          version: "0.12.1"

      - name: Install project and development dependencies
        run: uv sync --frozen

      - name: Ruff
        run: |
          uv run ruff format --check .
          uv run ruff check .

      - name: Type checking
        run: uv run pyright

      - name: CPU and model tests
        run: uv run pytest -q

      - name: Build wheel and source distribution
        run: uv build

      - name: Inspect distribution contents
        run: uv run python scripts/check_distribution.py dist/*.whl dist/*.tar.gz

      - name: Isolated wheel installation smoke
        shell: bash
        run: |
          project_dir="$PWD"
          smoke_dir="$(mktemp -d)"
          cd "$smoke_dir"
          uv run --isolated --no-project \
            --with "$project_dir/dist/onerobotics_a1_mjlab-0.1.0-py3-none-any.whl" \
            python "$project_dir/scripts/isolated_smoke.py" --workspace "$project_dir"
